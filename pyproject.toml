[project]
name = "payment-proof-lab"
version = "0.1.0"
description = "Executable payment specifications, Z3 bounded checking and runtime monitoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.7,<3",
    "pyqt6>=6.11.0",
    "pyqtdarktheme>=2.1.0",
    "uvicorn>=0.30,<1",
    "z3-solver>=4.13,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

