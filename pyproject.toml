[project]
name = "aegisflow"
version = "0.1.0"
description = "Spec-driven security verification for payment flows: Kripke/CTL, Z3 BMC/SMT, sanitizers and fuzzing"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pyqt6>=6.11.0",
    "pyqtdarktheme>=2.1.0",
    "z3-solver>=4.13,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

